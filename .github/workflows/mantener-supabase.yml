name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 15 */3 * *"   # cada 3 días, 9:00 a.m. hora de Monterrey/CDMX
  workflow_dispatch:          # permite correrlo a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl --fail --silent --show-error \
            "https://tdjbmpvqcawvdctrwufy.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_yqj8j21Kdjqeq9BD_dQHvg__jPp7qRk" \
            -H "Authorization: Bearer sb_publishable_yqj8j21Kdjqeq9BD_dQHvg__jPp7qRk"
          echo ""
          echo "Supabase respondió correctamente: proyecto activo."
